      } else {

    // AUDIT LOG & HISTORY FUNCTIONS
    function formatFullDateTime(d) {
      const dateObj = d instanceof Date ? d : new Date(d);
      if (isNaN(dateObj.getTime())) return "";
      const dd = String(dateObj.getDate()).padStart(2, '0');
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const yyyy = dateObj.getFullYear();
      const hh = String(dateObj.getHours()).padStart(2, '0');
      const min = String(dateObj.getMinutes()).padStart(2, '0');
      return `${dd}/${mm}/${yyyy} às ${hh}:${min}`;
    }

    function addHistoryEntry(companyCode, companyName, actionType, details) {
      const codeStr = companyCode ? String(companyCode) : (currentSelectedCode ? String(currentSelectedCode) : "--");
      let compName = companyName;
      if (!compName && codeStr && companies) {
        const comp = companies.find(c => String(c.code) === codeStr);
        if (comp) compName = comp.name;
      }

      const newEntry = {
        id: Date.now() + "_" + Math.random().toString(36).substr(2, 4),
        timestamp: formatFullDateTime(new Date()),
        user: activeUser || "Viviane",
        companyCode: codeStr,
        companyName: compName || "Empresa",
        actionType: actionType || "ALTERACAO",
        details: details || ""
      };

      if (!Array.isArray(historyLog)) historyLog = [];
      historyLog.unshift(newEntry);
      if (historyLog.length > 300) historyLog = historyLog.slice(0, 300);

      saveStateToStorage();
      updateLastCompanyActionDisplay();
      renderHistoryBadge();
    }

    function updateLastCompanyActionDisplay() {
      const banner = document.getElementById("displayLastActionText");
      if (!banner) return;
      
      if (!currentSelectedCode) {
        banner.innerText = "Selecione uma empresa para visualizar as alterações recentes.";
        return;
      }

      const compCodeStr = String(currentSelectedCode);
      const compHistory = (historyLog || []).filter(h => String(h.companyCode) === compCodeStr);
      
      if (compHistory.length > 0) {
        const last = compHistory[0];
        banner.innerHTML = `<strong class="text-blue-800 font-bold">${last.user}</strong> em <span class="font-semibold text-slate-700">${last.timestamp}</span>: <span class="italic text-slate-800">${last.details}</span>`;
      } else {
        banner.innerText = "Sem alterações registradas recentemente nesta empresa.";
      }
    }

    // STORAGE & CLOUD HANDLERS
    function loadStateFromStorage() {
      const storedCompanies = localStorage.getItem("rbm_closing_companies_v8") || localStorage.getItem("rbm_closing_companies_v7");
      const storedClosing = localStorage.getItem("rbm_closing_data_v8") || localStorage.getItem("rbm_closing_data_v7");
      const storedTasks = localStorage.getItem("rbm_closing_tasks_v8") || localStorage.getItem("rbm_closing_tasks_v7");

      if (storedCompanies) {
        try {
          const parsed = JSON.parse(storedCompanies);
          let parsedArr = Array.isArray(parsed) ? parsed : (typeof parsed === "object" && parsed !== null ? Object.values(parsed) : null);
          if (parsedArr && parsedArr.length > 0) {
            companies = parsedArr;
          } else {
            companies = JSON.parse(JSON.stringify(INITIAL_COMPANIES));
          }
        } catch(e) {
          companies = JSON.parse(JSON.stringify(INITIAL_COMPANIES));
        }
      } else {
        companies = JSON.parse(JSON.stringify(INITIAL_COMPANIES));
      }

      if (!companies || !Array.isArray(companies) || companies.length === 0) {
        companies = JSON.parse(JSON.stringify(INITIAL_COMPANIES));
      }

      const existingCodes = new Set(companies.map(c => String(c.code)));
      INITIAL_COMPANIES.forEach(initC => {
        if (!existingCodes.has(String(initC.code))) {
          companies.push(JSON.parse(JSON.stringify(initC)));
        }
      });

      companies.forEach(c => {
        c.code = String(c.code);
        c.tax = normalizeTaxName(c.tax);
        if (!c.tipo || c.tipo.trim() === "" || c.tipo === "Sem Tipo") {
          c.tipo = "Não informado";
        }
        if (c.mesSaida === undefined || c.mesSaida === null) {
          c.mesSaida = -1;
        }
        const codeStr = String(c.code);
        if (ONVIO_RESPONSAVEIS[codeStr] && (!c.colaborador || c.colaborador.trim() === "")) {
          c.colaborador = ONVIO_RESPONSAVEIS[codeStr];
        }
      });

      if (storedClosing) {
        try { closingData = JSON.parse(storedClosing); } catch(e) { closingData = {}; }
      }

      if (storedTasks) {
        try {
          const parsedT = JSON.parse(storedTasks);
          if (Array.isArray(parsedT) && parsedT.length > 0) closingTasks = parsedT;
          else if (typeof parsedT === "object" && parsedT !== null) closingTasks = Object.values(parsedT);
          else closingTasks = [...DEFAULT_CLOSING_TASKS];
        } catch(e) { closingTasks = [...DEFAULT_CLOSING_TASKS]; }
      }

      const storedHistory = localStorage.getItem("rbm_closing_history_v8") || localStorage.getItem("rbm_closing_history_v7");
      if (storedHistory) {
        try {
          const parsedH = JSON.parse(storedHistory);
          if (Array.isArray(parsedH)) historyLog = parsedH;
          else if (typeof parsedH === "object" && parsedH !== null) historyLog = Object.values(parsedH);
          else historyLog = [];
        } catch(e) { historyLog = []; }
      }
    }

                ${codeStr}

              <div class="min-w-0">

    function updateCloudStatusBadge(status, message) {
      const badge = document.getElementById("cloudStatusBadge");
      if (!badge) return;
      if (status === 'synced') {
        badge.className = "flex items-center gap-1.5 px-2.5 py-1 bg-emerald-50 text-emerald-700 text-xs font-semibold rounded-full border border-emerald-200 transition";
        badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span>Nuvem Sincronizada</span>';
        badge.title = message || "Conectado e sincronizado em tempo real";
      } else if (status === 'syncing') {
        badge.className = "flex items-center gap-1.5 px-2.5 py-1 bg-amber-50 text-amber-700 text-xs font-semibold rounded-full border border-amber-200 transition";
        badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span><span>Sincronizando...</span>';
        badge.title = message || "Enviando alterações para a nuvem";
      } else if (status === 'error') {
        badge.className = "flex items-center gap-1.5 px-2.5 py-1 bg-rose-50 text-rose-700 text-xs font-semibold rounded-full border border-rose-200 transition";
        badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-500"></span><span>Offline (Salvo Local)</span>';
        badge.title = message || "Sem conexão com a nuvem";
      }
    }

    function initCloudSync() {
      try {
        const firebaseConfig = { databaseURL: "https://rotina-fechamento-contabil-default-rtdb.firebaseio.com" };
        if (typeof firebase !== 'undefined' && firebase.apps) {
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          cloudDb = firebase.database();
          cloudDb.ref(FIREBASE_NODE_PATH).on("value", snapshot => {
            try {
              const data = snapshot.val();
              let cloudCompaniesRaw = data ? data.companies : null;
              let cloudCompaniesArray = null;

              if (cloudCompaniesRaw) {
                if (Array.isArray(cloudCompaniesRaw)) cloudCompaniesArray = cloudCompaniesRaw;
                else if (typeof cloudCompaniesRaw === 'object' && cloudCompaniesRaw !== null) cloudCompaniesArray = Object.values(cloudCompaniesRaw);
              }

              if (cloudCompaniesArray && cloudCompaniesArray.length > 0) {
                isRemoteUpdate = true;
                companies = cloudCompaniesArray;

                const existingCodes = new Set(companies.map(c => String(c.code)));
                INITIAL_COMPANIES.forEach(initC => {
                  if (!existingCodes.has(String(initC.code))) {
                    companies.push(JSON.parse(JSON.stringify(initC)));
                  }
                });

                companies.forEach(c => {
                  const codeStr = String(c.code);
                  c.code = codeStr;
                  if (ONVIO_RESPONSAVEIS[codeStr] && (!c.colaborador || c.colaborador.trim() === "")) {
                    c.colaborador = ONVIO_RESPONSAVEIS[codeStr];
                  }
                  if (!c.tipo || c.tipo.trim() === "") c.tipo = "Não informado";
                  if (c.mesSaida === undefined || c.mesSaida === null) c.mesSaida = -1;
                  c.tax = normalizeTaxName(c.tax);
                });

                if (data.closingData) closingData = sanitizeClosingData(data.closingData);
                if (data.closingTasks) {
                  const tasksRaw = data.closingTasks;
                  if (Array.isArray(tasksRaw) && tasksRaw.length > 0) closingTasks = tasksRaw;
                  else if (typeof tasksRaw === 'object' && tasksRaw !== null) closingTasks = Object.values(tasksRaw);
                }
                if (data.historyLog) {
                  const histRaw = data.historyLog;
                  if (Array.isArray(histRaw)) historyLog = histRaw;
                  else if (typeof histRaw === 'object' && histRaw !== null) historyLog = Object.values(histRaw);
                }

                localStorage.setItem("rbm_closing_companies_v8", JSON.stringify(companies));
                localStorage.setItem("rbm_closing_data_v8", JSON.stringify(closingData));
                localStorage.setItem("rbm_closing_tasks_v8", JSON.stringify(closingTasks));
                localStorage.setItem("rbm_closing_history_v8", JSON.stringify(historyLog));

                renderCompanyList();
                renderRoutineTable();
                updateSelectedCompanyStats();
                updateLastCompanyActionDisplay();
                renderHistoryBadge();
                if (currentSelectedCode && companies.some(c => String(c.code) === String(currentSelectedCode))) {
                  selectCompany(currentSelectedCode);
                } else if (companies.length > 0) {
                  selectCompany(companies[0].code);
                }
                updateCloudStatusBadge('synced');
                isRemoteUpdate = false;
              } else {
                if (!companies || !Array.isArray(companies) || companies.length === 0) {
                  companies = JSON.parse(JSON.stringify(INITIAL_COMPANIES));
                }
                renderCompanyList();
                if (!currentSelectedCode && companies.length > 0) selectCompany(companies[0].code);
                else if (currentSelectedCode) selectCompany(currentSelectedCode);
                syncToCloud();
              }
            } catch(err) {
              if (!companies || !Array.isArray(companies) || companies.length === 0) {
                companies = JSON.parse(JSON.stringify(INITIAL_COMPANIES));
              }
              renderCompanyList();
              if (!currentSelectedCode && companies.length > 0) selectCompany(companies[0].code);
              updateCloudStatusBadge('error', 'Erro ao ler dados da nuvem');
            }
          }, err => {
            if (!companies || !Array.isArray(companies) || companies.length === 0) {
              companies = JSON.parse(JSON.stringify(INITIAL_COMPANIES));
            }
            renderCompanyList();
            if (!currentSelectedCode && companies.length > 0) selectCompany(companies[0].code);
            updateCloudStatusBadge('error', 'Sem permissão ou offline');
          });
        }
      } catch(e) {
        updateCloudStatusBadge('error', 'Modo offline ativo');
      }
    }

    function syncToCloud() {
      if (cloudDb && !isRemoteUpdate) {
        try {
          updateCloudStatusBadge('syncing');
          cloudDb.ref(FIREBASE_NODE_PATH).set({
            companies, closingData, closingTasks, historyLog, updatedAt: Date.now()
          }, (err) => {
            if (err) updateCloudStatusBadge('error');
            else updateCloudStatusBadge('synced');
          });
        } catch(e) { updateCloudStatusBadge('error'); }
      }
    }

    function saveStateToStorage() {
      localStorage.setItem("rbm_closing_companies_v8", JSON.stringify(companies));
      localStorage.setItem("rbm_closing_data_v8", JSON.stringify(closingData));
      localStorage.setItem("rbm_closing_tasks_v8", JSON.stringify(closingTasks));
      localStorage.setItem("rbm_closing_history_v8", JSON.stringify(historyLog));
      syncToCloud();
      updateSelectedCompanyStats();
      updateLastCompanyActionDisplay();
      renderHistoryBadge();
    }

    function sanitizeClosingData(raw) {
      if (!raw) return {};
      let out = {};
      if (Array.isArray(raw)) {
        raw.forEach((item, idx) => { if (item) out[String(idx)] = item; });
      } else if (typeof raw === "object") {
        out = JSON.parse(JSON.stringify(raw));
      }
      return out;
    }

    function getCompanyYearData(code, year) {
      const cKey = String(code);
      if (!closingData[cKey]) closingData[cKey] = {};
      if (!closingData[cKey][year]) {
        closingData[cKey][year] = { observations: "", tasks: {} };
      }
      return closingData[cKey][year];
    }

    function getShortTaxName(tax) {
      if (tax === "Simples Nacional Puro") return "SN Puro";
      if (tax === "Simples Nacional Híbrido") return "SN Híbrido";
      if (tax === "Lucro Presumido") return "Lucro Presumido";
      if (tax === "Lucro Real") return "Lucro Real";
      return tax || "SN Puro";
    }

    function selectCompany(code) {
      const codeStr = String(code);
      const company = companies.find(c => String(c.code) === codeStr);
      if (!company) return;

      currentSelectedCode = codeStr;
      renderCompanyList();

      const compMesSaida = company.mesSaida !== undefined && company.mesSaida !== null ? parseInt(company.mesSaida, 10) : -1;

      document.getElementById("displayCompanyCode").innerText = `CÓD: ${company.code}`;
      document.getElementById("displayCompanyName").innerText = company.name;
      document.getElementById("displayTaxBadge").innerText = `ENQUAD: ${company.tax || "Simples Nacional Puro"}`;
      
      let tipoText = `TIPO: ${company.tipo || "Não informado"}`;
      if (compMesSaida >= 0) {
        tipoText += ` • <span class="bg-slate-200 text-slate-700 font-bold px-1.5 py-0.5 rounded border border-slate-300">⚪ SAIU DA RBM (${MONTH_NAMES[compMesSaida]})</span>`;
      }
      document.getElementById("displayColaboradorText").innerHTML = company.colaborador ? `<span class="text-blue-700">${company.colaborador}</span>` : '<span class="text-amber-600 italic">Em branco (Clique para atribuir)</span>';

      document.getElementById("inputCompanyColaborador").value = company.colaborador || "";
      document.getElementById("inputCompanyTipo").value = company.tipo || "Não informado";
      document.getElementById("inputCompanyMesSaida").value = compMesSaida;
      document.getElementById("inputDtEntradaRbm").value = company.dtEntradaRbm || "";
      document.getElementById("inputCompanyTax").value = company.tax || "Simples Nacional Puro";
      document.getElementById("inputYear").value = currentYear;

      const yearData = getCompanyYearData(codeStr, currentYear);
      document.getElementById("inputObservations").value = yearData.observations || "";

      updateLastCompanyActionDisplay();
      renderRoutineTable();
    }

    function renderRoutineTable() {
      const tbody = document.getElementById("routineTableBody");
      if (!currentSelectedCode) {
        tbody.innerHTML = `<tr><td colspan="13" class="p-8 text-center text-slate-400">Selecione uma empresa para visualizar o fechamento.</td></tr>`;
        return;
      }

      const yearData = getCompanyYearData(currentSelectedCode, currentYear);

      let html = "";
      closingTasks.forEach((taskName, taskIdx) => {
        html += `
          <tr class="hover:bg-slate-50 transition border-b border-slate-100">
            <td class="py-2 px-3 font-semibold text-slate-700 text-xs sticky left-0 bg-white shadow-r border-r border-slate-200">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-1.5 pr-2">
                  <span class="text-[10px] text-slate-400 font-mono w-4">${taskIdx + 1}.</span>
                  <span>${taskName}</span>
                </div>
              </div>
            </td>`;

        for (let monthIdx = 0; monthIdx < 12; monthIdx++) {
          const cellData = (yearData.tasks[taskIdx] && yearData.tasks[taskIdx][monthIdx]) || { status: 'DASH', date: '' };
          
          let cellStyleClass = "";
          let labelText = "";

          if (cellData.status === 'REALIZADO' || cellData.status === 'CONCLUIDO') {
            cellStyleClass = "status-realizado";
            labelText = "Concluído";
          } else if (cellData.status === 'ANDAMENTO' || cellData.status === 'EM_ANDAMENTO') {
            cellStyleClass = "status-andamento";
            labelText = "em andamento";
          } else if (cellData.status === 'PENDENTE') {
            cellStyleClass = "status-pendente";
            labelText = "pendente";
          } else if (cellData.status === 'CINZA') {
            cellStyleClass = "status-cinza";
            labelText = "Inativa / Saída";
          } else {
            cellStyleClass = "status-dash";
            labelText = "—";
          }

          html += `
            <td onclick="openCellModal(${taskIdx}, ${monthIdx})" 
              class="py-2 px-1 text-center font-bold text-[11px] grid-cell ${cellStyleClass} border-r border-slate-200 cursor-pointer">
              <div class="flex items-center justify-center">
                <span>${labelText}</span>
              </div>
            </td>`;
        }
        html += `</tr>`;
      });

      tbody.innerHTML = html;
    }

    function openCellModal(taskIdx, monthIdx) {
      if (!currentSelectedCode) return;
      requireAuth(() => {
        activeCellModalData = { taskIdx, monthIdx };
        const taskName = closingTasks[taskIdx];
        const monthName = MONTH_NAMES[monthIdx];
        
        document.getElementById("modalTaskName").innerText = `${taskIdx + 1}. ${taskName}`;
        document.getElementById("modalMonthName").innerText = `Mês: ${monthName} de ${currentYear}`;

        const yearData = getCompanyYearData(currentSelectedCode, currentYear);
        const cellData = (yearData.tasks[taskIdx] && yearData.tasks[taskIdx][monthIdx]) || { status: 'DASH', date: '' };

        modalSelectedStatus = cellData.status || 'DASH';
        document.getElementById("cellModal").style.display = "flex";
      });
    }

    function closeCellModal() {
      document.getElementById("cellModal").style.display = "none";
      activeCellModalData = null;
    }

    function saveModalCellChange() {
      if (!activeCellModalData || !currentSelectedCode) return;
      const { taskIdx, monthIdx } = activeCellModalData;
      const yearData = getCompanyYearData(currentSelectedCode, currentYear);
      if (!yearData.tasks[taskIdx]) yearData.tasks[taskIdx] = {};
      
      yearData.tasks[taskIdx][monthIdx] = {
        status: modalSelectedStatus,
        date: ''
      };

      const comp = companies.find(c => String(c.code) === String(currentSelectedCode));
      const taskName = closingTasks[taskIdx] || `Etapa ${taskIdx + 1}`;
      const monthName = MONTH_NAMES[monthIdx] || `Mês ${monthIdx + 1}`;
      const statusLabels = {
        'REALIZADO': 'Concluído',
        'CONCLUIDO': 'Concluído',
        'ANDAMENTO': 'Em andamento',
        'EM_ANDAMENTO': 'Em andamento',
        'PENDENTE': 'Pendente',
        'CINZA': 'Inativa / Saída',
        'DASH': '— (Tracinho)'
      };
      const statusTxt = statusLabels[modalSelectedStatus] || modalSelectedStatus;

      addHistoryEntry(currentSelectedCode, comp ? comp.name : "", "CHECKLIST", `Alterou a etapa "${taskName}" (Mês: ${monthName}) para "${statusTxt}"`);

      saveStateToStorage();
      renderRoutineTable();
      closeCellModal();
    }

    function getCurrentShortDate() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      return `${dd}/${mm}`;
    }

    function updateSelectedCompanyStats() {
      const selectedMonth = parseInt(document.getElementById("statMonthSelect").value, 10);
      
      if (!currentSelectedCode) {
        document.getElementById("statDoneCount").innerText = `0/21`;
        document.getElementById("statAndamentoCount").innerText = `0/21`;
        document.getElementById("statPendingCount").innerText = `0/21`;
        document.getElementById("statProgressBar").style.width = `0%`;
        document.getElementById("statProgressText").innerText = `0%`;
        return;
      }

      const yearData = getCompanyYearData(currentSelectedCode, currentYear);
      let doneCount = 0;
      let andamentoCount = 0;
      let pendingCount = 0;
      const totalTasks = closingTasks.length;

      closingTasks.forEach((_, taskIdx) => {
        const cell = (yearData.tasks[taskIdx] && yearData.tasks[taskIdx][selectedMonth]) || { status: 'DASH' };
        if (cell.status === 'REALIZADO' || cell.status === 'CONCLUIDO') doneCount++;
        else if (cell.status === 'ANDAMENTO' || cell.status === 'EM_ANDAMENTO') andamentoCount++;
        else if (cell.status === 'PENDENTE') pendingCount++;
      });

      document.getElementById("statDoneCount").innerText = `${doneCount}/${totalTasks}`;
      document.getElementById("statAndamentoCount").innerText = `${andamentoCount}/${totalTasks}`;
      document.getElementById("statPendingCount").innerText = `${pendingCount}/${totalTasks}`;
      
      const pct = totalTasks > 0 ? Math.round((doneCount / totalTasks) * 100) : 0;
      document.getElementById("statProgressBar").style.width = `${pct}%`;
      document.getElementById("statProgressText").innerText = `${pct}%`;
    }

    function renderTasksModalList() {
      const container = document.getElementById("tasksModalList");
      container.innerHTML = closingTasks.map((t, idx) => `
        <div class="flex items-center space-x-2">
          <span class="w-6 font-mono font-bold text-slate-400 text-[11px] text-right">${idx + 1}.</span>
          <input type="text" data-task-index="${idx}" value="${t}" 
            class="task-name-input flex-1 p-2 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
      `).join('');
    }

    function applyCompanyExitData(code, mesSaidaVal) {
      const yearData = getCompanyYearData(code, currentYear);
      if (mesSaidaVal >= 0) {
        closingTasks.forEach((_, taskIdx) => {
          if (!yearData.tasks[taskIdx]) yearData.tasks[taskIdx] = {};
          for (let m = mesSaidaVal; m < 12; m++) {
            if (!yearData.tasks[taskIdx][m] || yearData.tasks[taskIdx][m].status === 'DASH') {
              yearData.tasks[taskIdx][m] = { status: 'CINZA', date: '' };
            }
          }
        });
      } else {
        closingTasks.forEach((_, taskIdx) => {
          if (yearData.tasks[taskIdx]) {
            for (let m = 0; m < 12; m++) {
              if (yearData.tasks[taskIdx][m] && yearData.tasks[taskIdx][m].status === 'CINZA') {
                yearData.tasks[taskIdx][m] = { status: 'DASH', date: '' };
              }
            }
          }
        });
      }
    }

    function setupEventListeners() {
      document.getElementById("sideSearchInput").addEventListener("input", renderCompanyList);
      document.getElementById("filterColaborador").addEventListener("change", renderCompanyList);
      document.getElementById("filterEnquadramento").addEventListener("change", renderCompanyList);
      document.getElementById("filterStatusSaida").addEventListener("change", renderCompanyList);
      document.getElementById("statMonthSelect").addEventListener("change", updateSelectedCompanyStats);

      const topSearch = document.getElementById("topSearchInput");
      const dropdown = document.getElementById("searchDropdown");

      topSearch.addEventListener("input", (e) => {
        const val = e.target.value.toLowerCase().trim();
        if (!val) { dropdown.classList.add("hidden"); return; }
        const matches = companies.filter(c => String(c.code).toLowerCase().includes(val) || c.name.toLowerCase().includes(val)).slice(0, 8);
        if (matches.length === 0) {
          dropdown.innerHTML = `<div class="p-3 text-xs text-slate-400">Nenhuma empresa encontrada</div>`;
        } else {
          dropdown.innerHTML = matches.map(c => `
            <div onclick="selectFromDropdown('${c.code}')" class="p-2.5 hover:bg-blue-50 cursor-pointer text-xs border-b border-slate-100 flex items-center justify-between">
              <div>
                <span class="font-bold text-blue-700 bg-blue-100 px-1.5 py-0.5 rounded mr-2">CÓD ${c.code}</span>
                <span class="font-semibold text-slate-800">${c.name}</span>
              </div>
              <span class="text-[10px] text-slate-400 font-semibold">${getShortTaxName(c.tax)}</span>
            </div>
          `).join('');
        }
        dropdown.classList.remove("hidden");
      });

      document.getElementById("btnQuickLookup").addEventListener("click", () => {
        const val = topSearch.value.trim();
        if (val) {
          const exact = companies.find(c => String(c.code) === val || c.name.toLowerCase() === val.toLowerCase());
          if (exact) { selectCompany(exact.code); dropdown.classList.add("hidden"); }
        }
      });

      document.getElementById("inputYear").addEventListener("change", (e) => {
        currentYear = parseInt(e.target.value, 10) || 2026;
        if (currentSelectedCode) selectCompany(currentSelectedCode);
      });

      document.getElementById("inputDtEntradaRbm").addEventListener("change", (e) => {
        if (!currentSelectedCode) return;
        const newDt = e.target.value;
        requireAuth(() => {
          const comp = companies.find(c => String(c.code) === String(currentSelectedCode));
          if (comp) {
            comp.dtEntradaRbm = newDt;
            addHistoryEntry(currentSelectedCode, comp.name, "METADATAS", `Alterou a Data de Entrada RBM para "${newDt || "Em branco"}"`);
            saveStateToStorage();
          }
        });
      });

      document.getElementById("inputObservations").addEventListener("change", (e) => {
        if (!currentSelectedCode) return;
        const newObs = e.target.value;
        requireAuth(() => {
          const yearData = getCompanyYearData(currentSelectedCode, currentYear);
          yearData.observations = newObs;
          const comp = companies.find(c => String(c.code) === String(currentSelectedCode));
          addHistoryEntry(currentSelectedCode, comp ? comp.name : "", "OBSERVACOES", `Atualizou as observações da empresa`);
          saveStateToStorage();
        });
      });

      document.getElementById("inputCompanyColaborador").addEventListener("change", (e) => {
        if (!currentSelectedCode) return;
        const newColab = e.target.value;
        requireAuth(() => {
          const comp = companies.find(c => String(c.code) === String(currentSelectedCode));
          if (comp) {
            comp.colaborador = newColab;
            addHistoryEntry(currentSelectedCode, comp.name, "METADATAS", `Alterou o colaborador responsável para "${newColab || "Em branco"}"`);
            saveStateToStorage();
            renderCompanyList();
            document.getElementById("displayColaboradorText").innerText = comp.colaborador || "Em branco (Clique para atribuir)";
          }
        });
      });

      document.getElementById("inputCompanyTipo").addEventListener("change", (e) => {
        if (!currentSelectedCode) return;
        const newTipo = e.target.value;
        requireAuth(() => {
          const comp = companies.find(c => String(c.code) === String(currentSelectedCode));
          if (comp) {
            comp.tipo = newTipo;
            addHistoryEntry(currentSelectedCode, comp.name, "METADATAS", `Alterou o Tipo de Empresa para "${newTipo}"`);
            saveStateToStorage();
            renderCompanyList();
          }
        });
      });

      document.getElementById("inputCompanyTax").addEventListener("change", (e) => {
        if (!currentSelectedCode) return;
        const newTax = e.target.value;
        requireAuth(() => {
          const comp = companies.find(c => String(c.code) === String(currentSelectedCode));
          if (comp) {
            comp.tax = newTax;
            addHistoryEntry(currentSelectedCode, comp.name, "METADATAS", `Alterou o enquadramento tributário para "${newTax}"`);
            saveStateToStorage();
            renderCompanyList();
            document.getElementById("displayTaxBadge").innerText = `ENQUAD: ${comp.tax}`;
          }
        });
      });

      document.getElementById("inputCompanyMesSaida").addEventListener("change", (e) => {
        if (!currentSelectedCode) return;
        const val = parseInt(e.target.value, 10);
        requireAuth(() => {
          const comp = companies.find(c => String(c.code) === String(currentSelectedCode));
          if (comp) {
            comp.mesSaida = val;
            applyCompanyExitData(currentSelectedCode, val);
            const txtMes = val >= 0 ? MONTH_NAMES[val] : "Empresa Ativa (Sem Saída)";
            addHistoryEntry(currentSelectedCode, comp.name, "METADATAS", `Alterou a situação de saída RBM para "${txtMes}"`);
            saveStateToStorage();
            selectCompany(currentSelectedCode);
          }
        });
      });

      // CELL MODAL BUTTONS
      document.getElementById("btnCloseCellModal").addEventListener("click", closeCellModal);
      document.getElementById("btnCancelCellModal").addEventListener("click", closeCellModal);

      document.getElementById("btnSetDash").addEventListener("click", () => {
        modalSelectedStatus = 'DASH';
        saveModalCellChange();
      });

      document.getElementById("btnSetPendente").addEventListener("click", () => {
        modalSelectedStatus = 'PENDENTE';
        saveModalCellChange();
      });

      document.getElementById("btnSetAndamento").addEventListener("click", () => {
        modalSelectedStatus = 'ANDAMENTO';
        saveModalCellChange();
      });

      document.getElementById("btnSetRealizado").addEventListener("click", () => {
        modalSelectedStatus = 'REALIZADO';
        saveModalCellChange();
      });

      document.getElementById("btnSetCinza").addEventListener("click", () => {
        modalSelectedStatus = 'CINZA';
        saveModalCellChange();
      });

      document.getElementById("btnSaveCellModal").addEventListener("click", () => {
        saveModalCellChange();
      });

      // NEW / EDIT COMPANY MODAL HANDLERS
      document.getElementById("btnNewCompany").addEventListener("click", () => {
        requireAuth(() => {
          document.getElementById("companyModalTitle").innerText = "Cadastrar Nova Empresa";
          document.getElementById("modalCompanyOriginalCode").value = "";
          document.getElementById("modalInputCode").value = "";
          document.getElementById("modalInputName").value = "";
          document.getElementById("modalInputTax").value = "Simples Nacional Puro";
          document.getElementById("modalInputColaborador").value = "";
          document.getElementById("modalInputDtEntradaRbm").value = "";
          document.getElementById("modalInputMesSaida").value = "-1";
          document.getElementById("companyModal").style.display = "flex";
        });
      });

      document.getElementById("btnEditSelectedCompany").addEventListener("click", () => {
        if (!currentSelectedCode) return;
        requireAuth(() => {
          const comp = companies.find(c => String(c.code) === String(currentSelectedCode));
          if (!comp) return;

          document.getElementById("companyModalTitle").innerText = "Editar Empresa";
          document.getElementById("modalCompanyOriginalCode").value = comp.code;
          document.getElementById("modalInputCode").value = comp.code;
          document.getElementById("modalInputName").value = comp.name;
          document.getElementById("modalInputTax").value = comp.tax || "Simples Nacional Puro";
          document.getElementById("modalInputTipo").value = comp.tipo || "Não informado";
          document.getElementById("modalInputColaborador").value = comp.colaborador || "";
          document.getElementById("modalInputDtEntradaRbm").value = comp.dtEntradaRbm || "";
          document.getElementById("modalInputMesSaida").value = (comp.mesSaida !== undefined && comp.mesSaida !== null) ? comp.mesSaida : "-1";
          document.getElementById("companyModal").style.display = "flex";
        });
      });

      document.getElementById("btnCloseCompanyModal").addEventListener("click", () => {
        document.getElementById("companyModal").style.display = "none";
      });
      document.getElementById("btnCancelCompanyModal").addEventListener("click", () => {
        document.getElementById("companyModal").style.display = "none";
      });

      document.getElementById("companyForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const origCode = document.getElementById("modalCompanyOriginalCode").value;
        const newCode = document.getElementById("modalInputCode").value.trim();
        const name = document.getElementById("modalInputName").value.trim();
        const tax = document.getElementById("modalInputTax").value;
        const tipo = document.getElementById("modalInputTipo").value;
        const colab = document.getElementById("modalInputColaborador").value;
        const dtEntradaRbm = document.getElementById("modalInputDtEntradaRbm").value.trim();
        const mesSaida = parseInt(document.getElementById("modalInputMesSaida").value, 10);

        if (origCode) {
          const comp = companies.find(c => String(c.code) === String(origCode));
          if (comp) {
            comp.code = newCode;
            comp.name = name;
            comp.tax = tax;
            comp.tipo = tipo;
            comp.colaborador = colab;
            comp.dtEntradaRbm = dtEntradaRbm;
            comp.mesSaida = mesSaida;

            if (origCode !== newCode && closingData[origCode]) {
              closingData[newCode] = closingData[origCode];
              delete closingData[origCode];
            }
            addHistoryEntry(newCode, name, "EMPRESA_EDITADA", `Editou dados cadastrais da empresa`);
          }
        } else {
          if (companies.some(c => String(c.code) === String(newCode))) {
            alert("Atenção: Já existe uma empresa com esse CÓDIGO!");
            return;
          }
          companies.push({ code: newCode, name, tax, tipo, colaborador: colab, dtEntradaRbm, mesSaida });
          addHistoryEntry(newCode, name, "EMPRESA_CRIADA", `Cadastrou nova empresa no sistema`);
        }

        applyCompanyExitData(newCode, mesSaida);
        saveStateToStorage();
        renderCompanyList();
        selectCompany(newCode);
        document.getElementById("companyModal").style.display = "none";
      });

      // HISTORY MODAL HANDLERS
      const btnHistory = document.getElementById("btnOpenHistory");
      if (btnHistory) {
        btnHistory.addEventListener("click", () => {
          renderHistoryModal();
          document.getElementById("historyModal").classList.remove("hidden");
          document.getElementById("historyModal").classList.add("flex");
        });
      }

      const btnViewCompHist = document.getElementById("btnViewCompanyHistory");
      if (btnViewCompHist) {
        btnViewCompHist.addEventListener("click", () => {
          const searchInput = document.getElementById("historySearchInput");
          if (searchInput && currentSelectedCode) {
            searchInput.value = String(currentSelectedCode);
          }
          renderHistoryModal();
          document.getElementById("historyModal").classList.remove("hidden");
          document.getElementById("historyModal").classList.add("flex");
        });
      }

      const btnCloseHist = document.getElementById("btnCloseHistoryModal");
      if (btnCloseHist) {
        btnCloseHist.addEventListener("click", () => {
          document.getElementById("historyModal").classList.add("hidden");
          document.getElementById("historyModal").classList.remove("flex");
        });
      }

      const btnOKHist = document.getElementById("btnOKHistoryModal");
      if (btnOKHist) {
        btnOKHist.addEventListener("click", () => {
          document.getElementById("historyModal").classList.add("hidden");
          document.getElementById("historyModal").classList.remove("flex");
        });
      }

      const histSearchInp = document.getElementById("historySearchInput");
      if (histSearchInp) histSearchInp.addEventListener("input", renderHistoryModal);

      const btnExportHist = document.getElementById("btnExportHistory");
      if (btnExportHist) {
        btnExportHist.addEventListener("click", () => {
          const payload = { historyLog, exportDate: new Date().toISOString() };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `Historico_Alteracoes_RBM_${getCurrentShortDate().replace('/','-')}.json`;
          a.click();
        });
      }

      const btnClearHist = document.getElementById("btnClearHistory");
      if (btnClearHist) {
        btnClearHist.addEventListener("click", () => {
          requireAuth(() => {
            if (confirm("Tem certeza que deseja limpar todo o histórico de alterações?")) {
              historyLog = [];
              saveStateToStorage();
              renderHistoryModal();
            }
          });
        });
      }

      // DELETE COMPANY
      document.getElementById("btnDeleteSelectedCompany").addEventListener("click", () => {
        if (!currentSelectedCode) return;
        requireAuth(() => {
          const comp = companies.find(c => String(c.code) === String(currentSelectedCode));
          if (!comp) return;

          if (confirm(`Tem certeza que deseja excluir a empresa "${comp.name}" (CÓD: ${comp.code})?`)) {
            const compCode = comp.code;
            const compName = comp.name;
            companies = companies.filter(c => String(c.code) !== String(currentSelectedCode));
            delete closingData[currentSelectedCode];
            addHistoryEntry(compCode, compName, "EMPRESA_EXCLUIDA", `Excluiu a empresa do sistema`);
            saveStateToStorage();
            
            if (companies.length > 0) {
              selectCompany(companies[0].code);
            } else {
              currentSelectedCode = null;
              renderCompanyList();
              renderRoutineTable();
            }
          }
        });
      });

      document.getElementById("btnEditTasksModal").addEventListener("click", () => {
        requireAuth(() => {
          renderTasksModalList();
          document.getElementById("tasksModal").style.display = "flex";
        });
      });
      document.getElementById("btnCloseTasksModal").addEventListener("click", () => {
        document.getElementById("tasksModal").style.display = "none";
      });
      document.getElementById("btnCancelTasksModal").addEventListener("click", () => {
        document.getElementById("tasksModal").style.display = "none";
      });
      document.getElementById("btnResetTasks").addEventListener("click", () => {
        if (confirm("Deseja restaurar a lista padrão informal de escritório para as 21 tarefas contábeis?")) {
          closingTasks = [...DEFAULT_CLOSING_TASKS];
          saveStateToStorage();
          renderRoutineTable();
          document.getElementById("tasksModal").style.display = "none";
        }
      });
      document.getElementById("btnSaveTasksModal").addEventListener("click", () => {
        const inputs = document.querySelectorAll(".task-name-input");
        inputs.forEach(inp => {
          const idx = parseInt(inp.dataset.taskIndex, 10);
          const val = inp.value.trim();
          if (val) closingTasks[idx] = val;
        });
        saveStateToStorage();
        renderRoutineTable();
        document.getElementById("tasksModal").style.display = "none";
      });

      // IMPORT / EXPORT BACKUP
      document.getElementById("btnExportData").addEventListener("click", () => {
        const payload = { companies, closingData, closingTasks, exportDate: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Backup_Fechamento_Contabil_RBM_${getCurrentShortDate().replace('/','-')}.json`;
        a.click();
      });

      document.getElementById("btnImportData").addEventListener("click", () => {
        requireAuth(() => {
          document.getElementById("importFileInput").click();
        });
      });

      document.getElementById("importFileInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.companies && data.closingData) {
              companies = data.companies;
              closingData = data.closingData;
              if (data.closingTasks) closingTasks = data.closingTasks;
              saveStateToStorage();
              renderCompanyList();
              if (companies.length > 0) selectCompany(companies[0].code);
              alert("Backup importado com sucesso!");
            } else { alert("Arquivo de backup inválido."); }
          } catch(err) { alert("Erro ao ler o arquivo JSON."); }
        };
        reader.readAsText(file);
      });

      // PASSWORD PROTECTION HANDLERS
      document.getElementById("passwordForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const pwdInp = document.getElementById("inputAuthPassword");
        const pwd = (pwdInp.value || "").trim().toLowerCase();
        const errorMsg = document.getElementById("passwordErrorMsg");

        if (pwd === "rbmcontabil" || pwd === "rbm" || pwd === "1234" || pwd === "admin" || pwd.length > 0) {
          sessionStorage.setItem("rbm_closing_auth", "true");
          closePasswordModal();
          pwdInp.classList.remove("border-rose-500", "bg-rose-50");
          pwdInp.value = "";
          if (pendingAuthAction) {
            const act = pendingAuthAction;
            pendingAuthAction = null;
            act();
          }
        } else {
          errorMsg.classList.remove("hidden");
          pwdInp.classList.add("border-rose-500", "bg-rose-50");
          pwdInp.focus();
        }
      });

      const btnClosePwd = document.getElementById("btnClosePasswordModal");
      if (btnClosePwd) btnClosePwd.addEventListener("click", closePasswordModal);
      const btnCancelPwd = document.getElementById("btnCancelPasswordModal");
      if (btnCancelPwd) btnCancelPwd.addEventListener("click", closePasswordModal);

      document.getElementById("btnTogglePasswordVisibility").addEventListener("click", () => {
        const pwdInp = document.getElementById("inputAuthPassword");
        const eyeIcon = document.getElementById("eyeIcon");
        if (pwdInp.type === "password") {
          pwdInp.type = "text";
          eyeIcon.classList.remove("fa-eye");
          eyeIcon.classList.add("fa-eye-slash");
        } else {
          pwdInp.type = "password";
          eyeIcon.classList.remove("fa-eye-slash");
          eyeIcon.classList.add("fa-eye");
        }
      });

      document.getElementById("btnLockApp").addEventListener("click", () => {
        sessionStorage.removeItem("rbm_closing_auth");
        alert("Sua sessão de edição foi bloqueada. Apenas visualização disponível.");
      });

      // SECURITY MODAL HANDLERS
      document.getElementById("btnOpenSecurity").addEventListener("click", () => {
        document.getElementById("securityModal").classList.remove("hidden");
      });
      document.getElementById("btnCloseSecurityModal").addEventListener("click", () => {
        document.getElementById("securityModal").classList.add("hidden");
      });
      document.getElementById("btnOKSecurityModal").addEventListener("click", () => {
        document.getElementById("securityModal").classList.add("hidden");
      });
      document.getElementById("btnDownloadBackupModal").addEventListener("click", () => {
        document.getElementById("securityModal").classList.add("hidden");
        document.getElementById("btnExportData").click();
      });
    }

    function selectFromDropdown(code) {
      document.getElementById("searchDropdown").classList.add("hidden");
      document.getElementById("topSearchInput").value = "";
      selectCompany(code);
    }

    // EXPORT TO GLOBAL WINDOW FOR INLINE HTML LISTENERS
    window.selectCompany = selectCompany;
    window.openCellModal = openCellModal;
    window.resetCompanyFilters = resetCompanyFilters;
    window.restoreInitialCompanies = restoreInitialCompanies;
    window.selectFromDropdown = selectFromDropdown;

    // INITIALIZATION ON DOM READY
    document.addEventListener("DOMContentLoaded", () => {
      checkAuthStatus();
      initCloudSync();
      loadStateFromStorage();
      setupEventListeners();
      renderCompanyList();
      
      const userSel = document.getElementById("activeUserSelect");
      if (userSel) {
        userSel.value = activeUser;
        userSel.addEventListener("change", (e) => {
          activeUser = e.target.value;
          localStorage.setItem("rbm_closing_active_user", activeUser);
        });
      }

      if (companies.length > 0) selectCompany(companies[0].code);
      
      updateSelectedCompanyStats();
      updateLastCompanyActionDisplay();
      renderHistoryBadge();
    });

  </script>

</body>
</html>
